services:
  agent:
    build: .
    image: ${PUPPETEER_IMAGE:-puppeteer:local}
    env_file: ./plow-credentials
    ports:
      - "127.0.0.1:${HOST_PORT:-3001}:3001"
    volumes:
      - state:/var/lib/plow
    stop_grace_period: 35s
    restart: unless-stopped
  dev-dashboard:
    image: caddy:2@sha256:14a9c00d4e833ebc2b65d36515b37bde3b73f0b323a2663aaafc88953d8c4e3f
    network_mode: service:agent
    depends_on: [agent]
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      HOST_PORT: ${HOST_PORT:-3001}
volumes:
  state:
